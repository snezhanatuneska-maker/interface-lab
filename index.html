    <meta name="theme-color" content="#f8f8f6" />
    <script>
      // Set the theme before first paint: saved choice, else light. Kept in sync with src/lib/theme.ts.
      (function () {
        var t
        try { t = localStorage.getItem('theme') } catch (e) {}
        if (t !== 'dark') t = 'light'
        document.documentElement.dataset.theme = t
        document.querySelector('meta[name="theme-color"]').content = t === 'dark' ? '#131517' : '#f8f8f6'
      })()
    </script>
    <title>Interface Engineering Lab</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
